# HydroSIS-2D Configuration File
# Dam Break with Terrain - Classic test case with step terrain

[Domain]
# Computational domain
nx = 200           # Number of cells in x-direction
ny = 100           # Number of cells in y-direction
xmin = 0.0         # Domain origin x-coordinate (m)
ymin = 0.0         # Domain origin y-coordinate (m)
dx = 1.0           # Cell spacing in x-direction (m)
dy = 1.0           # Cell spacing in y-direction (m)

[Terrain]
# Bed elevation from file
# This creates a 5m step at x=100m representing a dam
bed_elevation_file = examples/terrain_dam_break.asc

[Simulation]
# Time integration
t_end = 10.0           # End time (s)
dt = 0.005             # Time step (s) - small for stability
cfl = 0.5              # CFL number for adaptive time stepping
output_interval = 0.5  # Output interval (s)

[Numerical]
# Numerical scheme parameters
theta = 1.5         # MUSCL slope limiter (1.0-2.0, 1.5=compromise)
gravity = 9.81      # Gravitational acceleration (m/s²)

[Initial Conditions]
# Dam break setup:
# - Left side (x < 100m): Water depth 10m above 5m dam = 15m total
# - Right side (x >= 100m): Shallow water 0.1m above flat bed = 5.1m total
# This creates a 10m water level difference
h_left = 15.0       # Water surface on left (m) - reservoir
h_right = 5.1       # Water surface on right (m) - downstream
u_left = 0.0        # Initial x-velocity on left (m/s)
u_right = 0.0       # Initial x-velocity on right (m/s)
v_left = 0.0        # Initial y-velocity on left (m/s)
v_right = 0.0       # Initial y-velocity on right (m/s)
x_discontinuity = 100.0  # Location of initial discontinuity (m)

[Boundary Conditions]
# Boundary condition types:
# 0 = Wall (reflective)
# 1 = Open (zero-gradient)
# 2 = Inflow (fixed state)
# 3 = Outflow (radiation)
bc_left = 0         # Wall boundary on left
bc_right = 0        # Wall boundary on right
bc_bottom = 0       # Wall boundary on bottom
bc_top = 0          # Wall boundary on top

[Output]
# Output settings
output_dir = output/dam_break_terrain
save_interval = 0.5     # Save VTK files every 0.5s
vtk_format = binary     # binary or ascii
save_initial = true     # Save initial condition

[Multi-GPU]
# GPU parallelization
use_multi_gpu = false   # Set true for multi-GPU runs
num_gpus = 1           # Number of GPUs to use
domain_decomposition = x  # Decomposition direction: x or y
