# HydroSIS-2D Configuration File
# Inflow/Outflow Boundary Condition Test Case
# Simulates channel flow with inflow on left, outflow on right

# Grid Parameters
nx = 1024
ny = 256
dx = 2.0
dy = 2.0
xmin = 0.0
ymin = 0.0

# Physical Parameters
gravity = 9.81
cfl = 0.45
h_dry = 1e-4
friction_type = 0

# Time Parameters
t_start = 0.0
t_end = 100.0
dt_max = 0.2
output_interval = 5.0

# Boundary Conditions - Channel flow
bc_left = 2     # inflow
bc_right = 3    # outflow
bc_bottom = 0   # wall
bc_top = 0      # wall

# Solver Options
use_lts = false
riemann_solver = 1
slope_limiter = 0
order = 2
