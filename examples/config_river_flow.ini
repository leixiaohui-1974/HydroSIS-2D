# HydroSIS-2D Configuration File
# River Flow Test Case with Inflow/Outflow Boundaries

# Grid Parameters
nx = 1024
ny = 256
dx = 2.0
dy = 2.0
xmin = 0.0
ymin = 0.0

# Physical Parameters
gravity = 9.81
cfl = 0.45
h_dry = 1e-4
friction_type = 0  # 0: Manning, 1: Chezy

# Time Parameters
t_start = 0.0
t_end = 100.0
dt_max = 0.2
output_interval = 5.0

# Boundary Conditions
# 0: wall, 1: open, 2: inflow, 3: outflow
bc_left = 2     # inflow
bc_right = 3    # outflow
bc_bottom = 0   # wall
bc_top = 0      # wall

# Solver Options
use_lts = false
riemann_solver = 1  # 0: HLL, 1: HLLC, 2: Roe
slope_limiter = 0   # 0: minmod, 1: superbee, 2: MC
order = 2           # 1: first-order, 2: second-order MUSCL
