# HydroSIS-2D Application Case: Dam Break in Valley
# Realistic dam failure scenario with downstream valley flooding

[Metadata]
case_name = Dam Break Valley Flooding
description = Simulation of catastrophic dam failure with downstream valley inundation
application = Flood hazard assessment, emergency planning
author = HydroSIS-2D Team
version = 1.0

[Domain]
# 2km × 1km downstream valley
nx = 400           # 400 cells in x-direction
ny = 200           # 200 cells in y-direction
xmin = 0.0         # Domain origin (m)
ymin = 0.0
dx = 5.0           # 5m resolution for realistic flood mapping
dy = 5.0

[Terrain]
# V-shaped valley with dam at upstream end
# Terrain slopes downward and inward toward valley center
bed_elevation_file = examples/applications/valley_terrain.asc

[Simulation]
# 5-minute simulation to capture initial flood wave
t_end = 300.0          # End time (s) = 5 minutes
dt = 0.01              # Initial time step (s)
cfl = 0.4              # Conservative CFL for stability
output_interval = 5.0  # Output every 5 seconds
adaptive_timestep = true

[Numerical]
theta = 1.3         # MUSCL limiter (more stable for complex terrain)
gravity = 9.81      # Standard gravity (m/s²)
friction = true     # Enable bed friction
manning_n = 0.035   # Manning's roughness coefficient (natural valley)
epsilon_h = 0.001   # Dry bed threshold (m)

[Initial Conditions]
# Dam reservoir and downstream conditions
# Reservoir: 50m deep water behind 60m high dam
# Downstream: Dry valley (0.01m water depth)
h_left = 60.0       # Reservoir water surface elevation (m above datum)
h_right = 0.01      # Downstream initial depth (nearly dry)
u_left = 0.0        # No initial velocity
u_right = 0.0
v_left = 0.0
v_right = 0.0
x_discontinuity = 200.0  # Dam location at x = 200m (upstream end)

[Boundary Conditions]
# Wall boundaries on valley sides, open downstream
bc_left = 0         # Wall - closed reservoir upstream
bc_right = 3        # Outflow - open downstream
bc_bottom = 0       # Wall - valley side
bc_top = 0          # Wall - valley side

[Output]
output_dir = output/dam_break_valley
save_interval = 5.0     # Save every 5 seconds
vtk_format = binary
save_initial = true
save_final = true
variables = h,u,v,z,eta,Fr  # Save depth, velocity, bed, surface, Froude number

[Analysis]
# Monitoring points for time series
monitor_points = 3
monitor_x = 400.0, 1000.0, 1800.0  # Locations along valley (m)
monitor_y = 500.0, 500.0, 500.0    # Valley centerline

[Multi-GPU]
use_multi_gpu = false
num_gpus = 1
domain_decomposition = x
