# HydroSIS-2D Application Case: Urban Flooding
# Flash flood in urban area due to extreme rainfall event

[Metadata]
case_name = Urban Flash Flooding
description = Extreme rainfall event causing street flooding in urban district
application = Urban flood risk assessment, drainage system design
author = HydroSIS-2D Team
version = 1.0

[Domain]
# 1km × 1km urban district with street grid
nx = 200           # 200 cells in x-direction
ny = 200           # 200 cells in y-direction
xmin = 0.0         # Domain origin (m)
ymin = 0.0
dx = 5.0           # 5m resolution for urban streets
dy = 5.0

[Terrain]
# Urban terrain with buildings represented as elevated areas
# Streets form a grid pattern with slight slope for drainage
bed_elevation_file = examples/applications/urban_terrain.asc

[Simulation]
# 30-minute rainfall event simulation
t_end = 1800.0         # End time (s) = 30 minutes
dt = 0.01              # Initial time step (s)
cfl = 0.45             # CFL for urban flooding
output_interval = 60.0 # Output every 1 minute
adaptive_timestep = true

[Numerical]
theta = 1.4         # MUSCL limiter
gravity = 9.81      # Standard gravity (m/s²)
friction = true     # Enable friction
manning_n = 0.015   # Manning's n for paved streets
epsilon_h = 0.005   # Dry bed threshold (m) - streets drain well

[Initial Conditions]
# Initially dry urban area
initial_condition = dry
h_initial = 0.001   # Nearly dry (1mm water depth)
u_initial = 0.0     # No initial flow
v_initial = 0.0

[Rainfall]
# Extreme rainfall event (cloudbursts)
enable_rainfall = true
rainfall_rate = 100.0  # mm/hr = 0.0000278 m/s (extreme event)
rainfall_start = 0.0   # Start immediately
rainfall_duration = 1800.0  # 30 minutes of heavy rain

[Boundary Conditions]
# Open boundaries to allow water to drain out
bc_left = 1         # Open - water can exit
bc_right = 1        # Open - water can exit
bc_bottom = 1       # Open - water can exit
bc_top = 1          # Open - water can exit

[Output]
output_dir = output/urban_flooding
save_interval = 60.0    # Save every 1 minute
vtk_format = binary
save_initial = true
save_final = true
variables = h,u,v,z,eta,Fr  # Save all flow variables

[Analysis]
# Monitor critical intersections
monitor_points = 4
monitor_x = 250.0, 500.0, 750.0, 500.0  # Street intersections
monitor_y = 500.0, 250.0, 500.0, 750.0

[Multi-GPU]
use_multi_gpu = false
num_gpus = 1
