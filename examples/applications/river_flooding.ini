# HydroSIS-2D Application Case: River Flooding
# River overflow and floodplain inundation from upstream flood wave

[Metadata]
case_name = River Floodplain Inundation
description = River flood event with overbank flow and floodplain inundation
application = Flood forecasting, floodplain mapping, levee design
author = HydroSIS-2D Team
version = 1.0

[Domain]
# 3km river reach with floodplain
nx = 600           # 600 cells in x-direction (streamwise)
ny = 200           # 200 cells in y-direction (cross-stream)
xmin = 0.0         # Domain origin (m)
ymin = 0.0
dx = 5.0           # 5m resolution
dy = 5.0

[Terrain]
# River channel with floodplain
# Channel in center, floodplain on both sides
bed_elevation_file = examples/applications/river_terrain.asc

[Simulation]
# 2-hour flood event
t_end = 7200.0         # End time (s) = 2 hours
dt = 0.02              # Initial time step (s)
cfl = 0.4              # Conservative CFL
output_interval = 300.0 # Output every 5 minutes
adaptive_timestep = true

[Numerical]
theta = 1.4         # MUSCL limiter
gravity = 9.81      # Standard gravity (m/s²)
friction = true     # Enable friction
manning_n = 0.030   # Manning's n for natural river channel
epsilon_h = 0.01    # Dry bed threshold (m)

[Initial Conditions]
# River already flowing at base level
initial_condition = uniform
h_initial = 2.0     # Initial flow depth (m) - normal flow
u_initial = 1.0     # Initial downstream velocity (m/s)
v_initial = 0.0     # No cross-stream flow initially

[Boundary Conditions]
# Inflow upstream, outflow downstream, walls on sides
bc_left = 2         # Inflow - upstream flood hydrograph
bc_right = 3        # Outflow - downstream radiation
bc_bottom = 0       # Wall - floodplain boundary
bc_top = 0          # Wall - floodplain boundary

[Inflow]
# Time-varying inflow boundary at upstream end
# Flood hydrograph: rises from base flow to peak, then recedes
inflow_type = hydrograph
base_depth = 2.0    # Base flow depth (m)
peak_depth = 8.0    # Peak flood depth (m)
base_velocity = 1.0 # Base flow velocity (m/s)
peak_velocity = 3.0 # Peak flow velocity (m/s)
time_to_peak = 1800.0  # 30 minutes to peak
peak_duration = 1800.0  # 30 minutes at peak
recession_time = 3600.0 # 60 minutes recession

[Output]
output_dir = output/river_flooding
save_interval = 300.0   # Save every 5 minutes
vtk_format = binary
save_initial = true
save_final = true
variables = h,u,v,z,eta,Fr,bed_shear  # Include bed shear stress

[Analysis]
# Monitor channel and floodplain
monitor_points = 5
monitor_x = 500.0, 1500.0, 2500.0, 1500.0, 1500.0  # Along river
monitor_y = 500.0, 500.0, 500.0, 300.0, 700.0      # Channel center and floodplain

[Multi-GPU]
use_multi_gpu = false
num_gpus = 1
domain_decomposition = x  # Streamwise decomposition for river
