# HydroSIS-2D Configuration File
# 1D Dam Break Test Case

# Grid Parameters
nx = 512
ny = 256
dx = 1.0
dy = 1.0
xmin = 0.0
ymin = 0.0

# Physical Parameters
gravity = 9.81
cfl = 0.5
h_dry = 1e-4
friction_type = 0  # 0: Manning, 1: Chezy

# Time Parameters
t_start = 0.0
t_end = 5.0
dt_max = 0.1
output_interval = 0.5

# Boundary Conditions
# 0: wall, 1: open, 2: inflow, 3: outflow
bc_left = 0
bc_right = 0
bc_bottom = 0
bc_top = 0

# Solver Options
use_lts = false
riemann_solver = 1  # 0: HLL, 1: HLLC, 2: Roe
slope_limiter = 0   # 0: minmod, 1: superbee, 2: MC
order = 2           # 1: first-order, 2: second-order MUSCL
