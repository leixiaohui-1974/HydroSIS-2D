# HydroSIS-2D Configuration File
# Channel Flow - Flow in parabolic channel with terrain

[Domain]
# Computational domain
nx = 200           # Number of cells in x-direction
ny = 100           # Number of cells in y-direction
xmin = 0.0         # Domain origin x-coordinate (m)
ymin = 0.0         # Domain origin y-coordinate (m)
dx = 1.0           # Cell spacing in x-direction (m)
dy = 1.0           # Cell spacing in y-direction (m)

[Terrain]
# Parabolic channel bed elevation
# Channel runs in x-direction with U-shaped cross-section
bed_elevation_file = examples/terrain_parabolic_channel.asc

[Simulation]
# Time integration
t_end = 30.0           # End time (s)
dt = 0.01              # Time step (s)
cfl = 0.5              # CFL number for adaptive time stepping
output_interval = 1.0  # Output interval (s)

[Numerical]
# Numerical scheme parameters
theta = 1.5         # MUSCL slope limiter (1.0-2.0, 1.5=compromise)
gravity = 9.81      # Gravitational acceleration (m/s²)

[Initial Conditions]
# Dam break in channel:
# - Upstream (x < 100m): High water depth
# - Downstream (x >= 100m): Low water depth
# Water will flow along the channel bottom
h_left = 8.0        # Water depth upstream (m)
h_right = 0.5       # Water depth downstream (m)
u_left = 0.0        # Initial x-velocity upstream (m/s)
u_right = 0.0       # Initial x-velocity downstream (m/s)
v_left = 0.0        # Initial y-velocity (m/s)
v_right = 0.0       # Initial y-velocity (m/s)
x_discontinuity = 100.0  # Location of initial discontinuity (m)

[Boundary Conditions]
# Boundary condition types:
# 0 = Wall (reflective)
# 1 = Open (zero-gradient)
# 2 = Inflow (fixed state)
# 3 = Outflow (radiation)
bc_left = 0         # Wall boundary on left (closed channel)
bc_right = 0        # Wall boundary on right (closed channel)
bc_bottom = 0       # Wall boundary on bottom (channel wall)
bc_top = 0          # Wall boundary on top (channel wall)

[Output]
# Output settings
output_dir = output/channel_flow
save_interval = 1.0     # Save VTK files every 1.0s
vtk_format = binary     # binary or ascii
save_initial = true     # Save initial condition

[Multi-GPU]
# GPU parallelization
use_multi_gpu = false   # Set true for multi-GPU runs
num_gpus = 1           # Number of GPUs to use
domain_decomposition = x  # Decomposition direction: x or y
